name: Windows x64 process-routing candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      INPUT_VERSION: 1.4.2-alpha.1
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned Throne GUI and core
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne
          ref: f52f3769e645a589feac9911753fa28392dc2702
          persist-credentials: false
      - name: Checkout pinned sing-box fork
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/sing-box
          ref: 9c9776a477b6946ccce4fd4f8b93943056e997ea
          path: sing-box-local
          persist-credentials: false
      - name: Install official Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: core/go.sum
      - name: Apply reviewed patches and prepare installer
        run: |
          set -euo pipefail
          echo '' | base64 -d > process-windows.patch
          echo '' | base64 -d > validation.patch
          git -C sing-box-local apply --check ../process-windows.patch
          git -C sing-box-local apply ../process-windows.patch
          git apply --check validation.patch
          git apply validation.patch
          cd core
          go mod edit -replace github.com/sagernet/sing-box=../sing-box-local
          cd ..
          python - <<'PYCODE'
          from pathlib import Path
          s=Path('script/windows_installer.iss').read_text()
          s=s.replace('AppVerName=Throne {#AppVersion}', 'AppVerName=Throne {#AppVersion} (custom process routing candidate)')
          s=s.replace('ArchitecturesInstallIn64BitMode=win64', 'ArchitecturesAllowed=x64os\nArchitecturesInstallIn64BitMode=x64os\nMinVersion=10.0.17763')
          s='\n'.join(l for l in s.splitlines() if not l.startswith('Source: "deployment\\windowslegacy') and not l.startswith('Source: "deployment\\windows-arm64'))+'\n'
          Path('script/windows_installer_x64.iss').write_text(s)
          # Exercise the actual parser copied verbatim from this pinned source, not a reimplementation.
          src=Path('src/ui/mainWindow/mainwindow_system.cpp').read_text()
          start=src.index('using Version = std::array<int, 5>;')
          end=src.index('bool isNewer(',start)
          parser=src[start:end]
          test='#include <array>\n#include <optional>\n#include <QString>\n#include <QRegularExpression>\n'+parser+'\nint main(){ auto old=parseVersion("1.4.1"); auto current=parseVersion("1.4.2-alpha.1"); auto next=parseVersion("1.4.2"); return (!old || !current || !next || !(*old < *current && *current < *next)) ? 1 : 0; }\n'
          Path('version_compare_test.cpp').write_text(test)
          with Path('CMakeLists.txt').open('a') as f:
              f.write('\nadd_executable(version_compare_test version_compare_test.cpp)\ntarget_link_libraries(version_compare_test PRIVATE Qt6::Core)\n')
          PYCODE
      - name: Native Windows matching and WFP rule-construction tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          (cd sing-box-local && go test -v ./route/rule) 2>&1 | tee test-results/process-tests.txt
          (cd core && go test -v ./internal/guard) 2>&1 | tee test-results/guard-construction-tests.txt
          (cd validation/probe && go test -v ./... && go build -o ../routing-probe.exe .) 2>&1 | tee test-results/probe-tests.txt
      - name: Install protoc generators and compile core
        run: |
          set -euo pipefail
          curl -fLso "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          export PATH="$RUNNER_TEMP/protoc/bin:$(go env GOPATH)/bin:$PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          export DEST="$PWD/deployment/windows-amd64"
          bash script/build_go.sh
      - name: Checkout dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
          persist-credentials: false
      - name: Configure MSVC x64
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -prerelease -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          $bat = Join-Path $env:RUNNER_TEMP 'vcvars.cmd'
          Set-Content -LiteralPath $bat -Encoding ascii -Value "@call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" x64 >nul && set"
          $vars = & $bat
          if (-not ($vars -ceq 'VSCMD_ARG_TGT_ARCH=x64')) { throw 'MSVC x64 environment failed' }
          foreach ($line in $vars) {
            $name, $value = $line -split '=', 2
            if ($null -ne $value -and $value -cne [Environment]::GetEnvironmentVariable($name)) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" }
          }
      - name: Compile matching pinned GUI and version comparison test
        run: |
          set -euo pipefail
          rm -rf dashboard-src/.git
          cp -R dashboard-src/. res/dashboard/
          test -f res/dashboard/index.html
          curl -fLso qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_6.12.0/Qt_6.12.0_x64.7z
          curl -fLso openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_x64.7z
          7z x -y qt.7z > /dev/null
          7z x -y openssl.7z > /dev/null
          export CMAKE_PREFIX_PATH="$PWD/Qt/lib/cmake"
          export OPENSSL_ROOT_DIR="$PWD/openssl"
          mkdir -p build
          curl -fLso build/srslist.h https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DINPUT_VERSION="$INPUT_VERSION"
          cmake --build build --parallel 4
          cp build/Throne.exe deployment/windows-amd64/
          build/version_compare_test.exe
      - name: Verify GUI version without starting networking
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'deployment/windows-amd64/Throne.exe'
          $out = Join-Path $PWD 'test-results/version.txt'
          $err = Join-Path $PWD 'test-results/version-stderr.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--headless','--version' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Version smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "Version smoke test exit $($p.ExitCode)" }
          $version = (Get-Content -Raw $out).Trim()
          if ($version -ne 'Throne 1.4.2-alpha.1') { throw "Unexpected version: $version" }
      - name: Build x64 installer and checksums
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Official Inno Setup 6 compiler missing from runner' }
          $notes = @'
          Custom experimental Windows x64 build 1.4.2-alpha.1.
          GUI and core: throneproj/Throne f52f3769e645a589feac9911753fa28392dc2702.
          sing-box: 9c9776a477b6946ccce4fd4f8b93943056e997ea plus process-windows.patch.
          Native matcher tests, WFP rule-construction tests, GUI version startup and version comparison run in this workflow.
          Clean installation and same-version reinstallation smoke tests are included; see workflow result and installer logs.
          Migration from official1.4.1 or the user existing version was NOT tested.
          Actual TUN/WFP traffic, DNS, crash and disconnect leak tests were NOT performed.
          Back up configuration before installing. Do not uninstall first. Use existing installation directory.
          Official updater endpoint remains unchanged. Future official stable1.4.2 compares newer and replaces custom core.
          '@
          Set-Content -Encoding utf8 deployment/windows-amd64/BUILD-INFO.txt $notes
          & $iscc /Q /DAppVersion=1.4.2-alpha.1 /DAppVersionMajor=1 /DAppVersionMinor=4 /DAppVersionPatch=2 /DAppVersionBuild=0 /FThrone-1.4.2-alpha.1-windows-x64-installer script/windows_installer_x64.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = 'deployment/Throne-1.4.2-alpha.1-windows-x64-installer.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          "$hash  Throne-1.4.2-alpha.1-windows-x64-installer.exe" | Set-Content -Encoding ascii deployment/SHA256SUMS.txt
      - name: Native installer and same-version reinstall smoke test
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'deployment/Throne-1.4.2-alpha.1-windows-x64-installer.exe'
          $install = Join-Path $env:RUNNER_TEMP 'Throne'
          $logs = Join-Path $PWD 'test-results'
          foreach ($round in 1..2) {
            $log = Join-Path $logs "installer-round-$round.log"
            $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$install`"", "/LOG=`"$log`"")
            $p = Start-Process -FilePath $setup -ArgumentList $args -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Installer round $round timed out" }
            if ($p.ExitCode -ne 0) { throw "Installer round $round exit $($p.ExitCode)" }
            foreach ($name in @('Throne.exe','ThroneCore.exe','updater.exe','libcronet.dll')) {
              $expected = (Get-FileHash -Algorithm SHA256 (Join-Path 'deployment/windows-amd64' $name)).Hash
              $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $install $name)).Hash
              if ($expected -ne $actual) { throw "Installed $name differs from build" }
            }
            $marker = Join-Path $install 'config/config-preservation.marker'
            if ($round -eq 1) {
              New-Item -ItemType Directory -Force (Split-Path $marker) | Out-Null
              Set-Content -Encoding ascii $marker 'preserve-this-custom-install-test'
            } elseif ((Get-Content -Raw $marker).Trim() -ne 'preserve-this-custom-install-test') {
              throw 'Reinstall changed the config preservation marker'
            }
          }
          'Installer and same-version reinstall passed. This does not test migration from official1.4.1 or real user settings.' | Set-Content -Encoding utf8 test-results/installer-smoke.txt
      - name: Upload installer, patches and validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Throne-1.4.2-alpha.1-windows-x64-candidate
          if-no-files-found: error
          path: |
            deployment/*installer.exe
            deployment/SHA256SUMS.txt
            deployment/windows-amd64/BUILD-INFO.txt
            process-windows.patch
            validation.patch
            script/windows_installer_x64.iss
            validation/WINDOWS-INTEGRATION.md
            validation/routing-probe.exe
            test-results/
